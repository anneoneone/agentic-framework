[project]
name = "memento-knowledge"
version = "1.0.0"
description = "Neo4j-backed knowledge graph MCP server for agent-framework"
requires-python = ">=3.10"

dependencies = [
    "fastmcp>=2.0.0",
    "neo4j>=5.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "black",
    "ruff",
    "mypy",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"
