[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-registry-mcp"
version = "0.1.0"
description = "MCP server for copilot-agents registry — agent discovery and routing"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Copilot Agents Framework Team"}
]
keywords = [
    "mcp",
    "agent",
    "registry",
    "discovery",
    "routing"
]

dependencies = [
    "fastmcp>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.23.0",
    "black>=23.0",
    "ruff>=0.1.0",
    "mypy>=1.0",
]

[project.scripts]
agent-registry = "agent_registry.server:main"

[tool.setuptools]
packages = ["agent_registry"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"
select = ["E", "F", "W", "I"]

[tool.mypy]
python_version = "3.10"
strict = true
implicit_optional = true
