[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "spec-to-test"
version = "0.1.0"
description = "Generate pytest test files from PDF test-specification documents (OCPP 2.0.1 and others)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # PDF extraction
    "pymupdf4llm>=0.0.17",       # Primary: structure-preserving Markdown extraction
    "pdfplumber>=0.11",           # Fallback: borderless-table extraction
    # OCPP datatypes & schemas (mobilityhouse) — source of truth, replaces PDF extraction for datatypes
    "ocpp>=2.0.0",
    # IR modeling
    "pydantic>=2.0",
    # LLM extraction layer
    "anthropic>=0.40",
    # Code generation
    "jinja2>=3.0",
    # Semantic QA
    "sentence-transformers>=3.0",
    # CLI
    "click>=8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
]

[project.scripts]
spec-to-test = "spec_to_test.cli:main"
spec-ask     = "spec_to_test.knowledge.qa_engine:ask_cli"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.hatch.build.targets.wheel.sources]
"src" = "spec_to_test"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
